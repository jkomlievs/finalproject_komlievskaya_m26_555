[project]
name = "finalproject_komlievskaya_m26_555"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.10",
    "python-dotenv>=1.2.4",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
